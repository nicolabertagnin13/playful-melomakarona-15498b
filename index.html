<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Modulo Integrità Locale</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e293b">

<!-- Per iPad / iPhone (Safari) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Modulo CED">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
  /* ===== VARIABILI DI TEMA ===== */
  :root {
    --bg-base: #0a0d14;              /* sfondo principale quasi nero */
    --bg-gradient: radial-gradient(circle at 95% 5%, rgba(190, 230, 0, 0.18) 0%, transparent 45%);
    --card-bg: #14181f;              /* schede grigio scuro */
    --card-bg-2: #1a1e26;            /* schede hover */
    --border-soft: rgba(190, 230, 0, 0.15);  /* bordi verdi tenui */
    --accent: #bef264;               /* giallo-verde fluorescente */
    --accent-bright: #d9ff4d;        /* più luminoso al hover */
    --accent-soft: rgba(190, 242, 100, 0.12); /* sfondo accent tenue */
    --text-dark: #f1f5f9;            /* testo principale (bianco) */
    --text-light: #94a3b8;           /* testo secondario (grigio) */
    --success: #bef264;              /* stesso accent per coerenza */
    --danger: #ef4444;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.7);
    --glow: 0 0 12px rgba(190, 242, 100, 0.35); /* effetto neon */
    --radius: 12px;
  }

    /* ===== TEMA CHIARO (STILE EXOR) ===== */
  body.light-theme {
    --bg-base: #e5e7eb;              /* Sfondo grigio chiaro generale */
    --bg-gradient: none;             
    --card-bg: #f3f4f6;
    --card-bg-2: #e5e7eb;
    --border-soft: #d1d5db;
    --accent: #991b1b;               /* Rosso scuro aziendale */
    --accent-bright: #7f1d1d;        
    --accent-soft: rgba(153, 27, 27, 0.1);
    --text-dark: #111827;            /* Testo quasi nero */
    --text-light: #4b5563;           /* Testo grigio scuro */
    --success: #166534;              
    --danger: #b91c1c;
    --glow: none;                    
  }

    /* Ripristina il foglio bianco del PDF quando si usa il tema chiaro */
  body.light-theme #pdfContainer.dark-pdf #pdfCanvas {
    filter: none !important;
  }

  /* Adattamenti specifici per il tema chiaro */
  body.light-theme header {
    background: #991b1b;             /* Header rosso */
    border-bottom: 2px solid #7f1d1d;
  }
  body.light-theme header h1 {
    color: #ffffff;
  }
  body.light-theme #toolbar {
    background: #f3f4f6;
    color: #374151;
    border-bottom: 1px solid #d1d5db;
  }
  
  /* I pulsanti nell'header sul rosso */
  body.light-theme header button {
    color: #ffffff;
    border-color: #ffffff;
  }
  body.light-theme header button:hover {
    background: rgba(251, 251, 251, 0.2);
    box-shadow: none;
  }
  body.light-theme header button.success {
    background: #ffffff;
    color: #991b1b;
    border-color: #ffffff;
  }
  body.light-theme header button.success:hover {
    background: #f3f4f6;
  }
  body.light-theme header button.danger {
    color: #ffffff;
    border-color: #ffffff;
  }
  body.light-theme header button.danger:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  /* L'area del PDF nel tema chiaro */
  body.light-theme #main {
    background-color: #e5e7eb;
  }
  body.light-theme #pdfContainer.dark-pdf {
    background: #e5e7eb;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  body.light-theme #pdfContainer.dark-pdf .field {
    background: #ffffff;
    border: 1.5px solid #991b1b;
    color: #111827;
  }
  body.light-theme #pdfContainer.dark-pdf .field:focus {
    border-color: #991b1b;
    box-shadow: 0 0 0 3px rgba(153, 27, 27, 0.2);
  }
  body.light-theme #pdfContainer.dark-pdf .field::placeholder {
    color: #9ca3af;
  }

  /* L'etichetta della firma */
  body.light-theme .sigLabel {
    background: #991b1b;
    color: #ffffff;
    border: none;
  }
  
  /* La modale nel tema chiaro */
  body.light-theme #inputModal {
    background: rgba(0, 0, 0, 0.5); 
  }
  body.light-theme #inputModal .modal-content {
    background: #ffffff;
    border: none;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    padding: 0; 
  }
  body.light-theme #inputModal h3 {
    background: #991b1b;
    color: #ffffff;
    padding: 16px 20px;
    border-radius: 8px 8px 0 0;
    font-size: 16px;
    text-transform: none; 
    letter-spacing: normal;
    margin-bottom: 16px;
  }
  body.light-theme #inputModal textarea {
    background: #ffffff;
    border: 2px solid #991b1b;
    border-radius: 6px;
    color: #111827;
    width: calc(100% - 40px); 
    margin: 0 20px;
    height: 120px;
  }
  body.light-theme #inputModal textarea:focus {
    box-shadow: 0 0 0 3px rgba(153, 27, 27, 0.2);
  }
  body.light-theme #inputModal .modal-buttons {
    padding: 0 20px 20px 20px; 
    margin-top: 16px;
  }
  body.light-theme #inputModal button.secondary {
    color: #4b5563;
    border-color: #d1d5db;
  }
  body.light-theme #inputModal button.secondary:hover {
    background: #f3f4f6;
    color: #111827;
  }
  body.light-theme #inputModal button:not(.secondary) {
    background: #991b1b;
    color: #ffffff;
    border-color: #991b1b;
  }
  body.light-theme #inputModal button:not(.secondary):hover {
    background: #7f1d1d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-base);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-dark);
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }

  /* Il colore della firma è gestito via JS in base al tema */
.sigBox canvas {
  display: block; width: 100%; height: 100%;
  touch-action: none; cursor: crosshair;
}

  /* ===== HEADER ===== */
  header {
    background: #0f1319;
    color: #fff;
    padding: 14px 20px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    border-bottom: 2px solid var(--accent);
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 10;
  }
  header h1 {
  font-size: 16px; margin: 0; flex: 1;
  letter-spacing: 0.5px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
}

  /* ===== BOTTONI ===== */
  button {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }
  button:hover {
    background: var(--accent-soft);
    color: var(--accent-bright);
    border-color: var(--accent-bright);
    box-shadow: var(--glow);
  }
  button:active { transform: scale(0.97); }
  button.secondary {
    color: var(--text-light);
    border-color: rgba(148, 163, 184, 0.4);
  }
  button.secondary:hover {
    color: #fff;
    border-color: rgba(148, 163, 184, 0.8);
    background: rgba(148, 163, 184, 0.1);
    box-shadow: none;
  }
  button.success {
    background: var(--accent);
    color: #0a0d14;
    border-color: var(--accent);
  }
  button.success:hover {
    background: var(--accent-bright);
    border-color: var(--accent-bright);
    box-shadow: var(--glow);
  }
  button.danger {
    color: var(--danger);
    border-color: var(--danger);
  }
  button.danger:hover {
    background: rgba(239, 68, 68, 0.15);
    color: #fff;
    border-color: var(--danger);
    box-shadow: 0 0 12px rgba(239,68,68,0.4);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== BARRA STRUMENTI ===== */
  #toolbar {
    background: #0f1319;
    padding: 10px 20px;
    display: flex; gap: 8px;
    border-bottom: 1px solid rgba(190, 242, 100, 0.08);
    flex-wrap: wrap; align-items: center;
    font-size: 13px; color: var(--text-light);
  }
  #toolbar .info { flex: 1; }

  /* ===== AREA PRINCIPALE ===== */
  #main {
    flex: 1; overflow: auto; padding: 20px;
    display: flex; justify-content: center; align-items: flex-start;
    touch-action: pan-x pan-y pinch-zoom;
  }

  #pdfContainer {
    position: relative;
    background: #fff;
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.7), 0 0 40px rgba(190, 242, 100, 0.08);
    border-radius: 8px;
    overflow: hidden;
    max-width: 100%;
    border: 1px solid var(--border-soft);
  }

  #pdfCanvas { display: block; max-width: 100%; height: auto; }

  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    touch-action: pan-x pan-y pinch-zoom;
  }

  /* ===== CAMPI DI TESTO ===== */
  .field {
  position: absolute;
  border: 1.5px solid var(--accent);
  background: rgba(190, 242, 100, 0.08);
  border-radius: 6px;
  font-size: 14px;
  padding: 6px 10px;
  outline: none;
  font-family: inherit;
  color: var(--text-dark);
  line-height: 1.3;
  z-index: 5;
  pointer-events: auto;
  overflow: hidden;
  transition: all 0.2s;
  touch-action: manipulation;
  box-sizing: border-box;

  /* BLOCCA IL RIDIMENSIONAMENTO */
  resize: none !important;
  min-width: 0;
  min-height: 0;
  max-width: none;
  max-height: none;

  /* Ombra leggera per staccare la casella */
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

/* Nasconde la maniglia nativa di Chrome/Android/Edge */
.field::-webkit-resizer {
  display: none !important;
  background: transparent;
  width: 0 !important;
  height: 0 !important;
}
  .field:focus {
  background: rgba(190, 242, 100, 0.2);
  box-shadow: 0 0 0 3px rgba(190, 242, 100, 0.2), var(--glow);
  z-index: 50;
}

  /* ===== AREA FIRMA ===== */
  .sigBox {
    position: absolute;
    border: 2px solid var(--accent);
    background: rgba(190, 242, 100, 0.06);
    border-radius: 8px;
    z-index: 5;
  }
  .sigBox canvas {
  display: block; width: 100%; height: 100%;
  touch-action: none; cursor: crosshair;
  /* Firma nera di default */
}

  .sigLabel {
    position: absolute;
    top: 0;                          /* Allineata in alto */
    left: 100%;                      /* Spostata fuori dal box, a destra */
    margin-left: 10px;               /* Spazio tra il box e l'etichetta */
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    background: rgba(190, 242, 100, 0.1);
    padding: 4px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;             /* Evita che il testo vada a capo */
    pointer-events: none;            /* Non blocca il disegno della firma */
}

  /* ===== SCHERMATA DI CARICAMENTO ===== */
  #loading {
    position: fixed; inset: 0;
    background-color: var(--bg-base);
    background-image: var(--bg-gradient);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; z-index: 100;
  }
  #loading p { color: var(--text-light); font-size: 14px; letter-spacing: 0.5px; }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(190, 242, 100, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    box-shadow: var(--glow);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  /* ===== MODALE DI INPUT ===== */
  #inputModal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    padding: 20px;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  #inputModal .modal-content {
    background: #14181f;
    border: 1.5px solid var(--border-soft);
    border-radius: var(--radius);
    width: 100%; max-width: 500px;
    padding: 24px;
    display: flex; flex-direction: column;
    gap: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(190, 242, 100, 0.1);
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  #inputModal h3 {
    margin: 0;
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  #inputModal textarea {
    width: 100%; height: 150px;
    padding: 14px; font-size: 16px;
    border: 1.5px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    background: #0a0d14;
    color: var(--text-dark);
    transition: all 0.2s;
  }
  #inputModal textarea::placeholder {
    color: rgba(148, 163, 184, 0.5);
  }
  #inputModal textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(190, 242, 100, 0.15), var(--glow);
  }
  #inputModal .modal-buttons {
    display: flex; gap: 10px; justify-content: flex-end;
  }
  #inputModal button {
    padding: 10px 22px; font-size: 14px;
  }

  /* ===== TEMA SCURO SOLO PER LA VISUALIZZAZIONE ===== */
/* Il PDF rimane bianco nel file esportato */
#pdfContainer.dark-pdf #pdfCanvas {
  filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(1.1);
}

/* La carta sotto il canvas si adatta al tema scuro */
#pdfContainer.dark-pdf {
  background: #0a0d14;
  box-shadow: 0 0 24px rgba(0,0,0,0.7), 0 0 40px rgba(190, 242, 100, 0.15);
}

/* I campi compilabili si adattano al tema scuro */
#pdfContainer.dark-pdf .field {
  background: rgba(190, 242, 100, 0.18);
  color: #fff;
}
#pdfContainer.dark-pdf .field:focus {
  background: rgba(190, 242, 100, 0.28);
}

/* I placeholder si vedono bene sul fondo scuro */
#pdfContainer.dark-pdf .field::placeholder {
  color: rgba(241, 245, 249, 0.5);
}

.header-logo {
  height: 26px;
  width: auto;
  vertical-align: middle;
  margin-right: 8px;
}

#supportBtn:hover {
  background: var(--accent-bright, #d9ff4d);
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 30px rgba(190, 242, 100, 0.7);
}
#supportBtn:active {
  transform: scale(0.95);
}
#supportBtn svg {
  width: 30px;
  height: 30px;
}

/* ===== TASTO SUPPORTO ===== */
#supportBtn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--accent, #bef264);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 20px rgba(190, 242, 100, 0.4);
  z-index: 998;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  text-decoration: none;
}

/* ===== LAYOUT ORIENTAMENTO ===== */

/* Orizzontale (landscape): header e toolbar compatti */
@media (orientation: landscape) and (max-height: 600px) {
  header {
    padding: 8px 16px;
    gap: 8px;
  }
  header h1 {
    font-size: 14px;
  }
  header .header-logo {
    height: 20px;
  }
  header button {
    padding: 7px 12px;
    font-size: 12px;
  }
  #toolbar {
    padding: 6px 16px;
    font-size: 12px;
  }
  #main {
    padding: 10px;
  }
}

/* Verticale (portrait): nasconde il tasto supporto se lo schermo è piccolo */
@media (orientation: portrait) and (max-width: 480px) {
  #supportBtn {
    width: 50px;
    height: 50px;
    bottom: 16px;
    right: 16px;
  }
  #supportBtn svg {
    width: 24px;
    height: 24px;
  }
}

/* Indicatore di rotazione (mostrato solo in verticale su schermi piccoli) */
#rotateHint {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(190, 242, 100, 0.15);
  color: var(--accent);
  border: 1px solid var(--border-soft);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s ease;
}


#rotateHint.visible {
  opacity: 1;
}

/* Nasconde il suggerimento in orizzontale */
@media (orientation: landscape) {
  #rotateHint {
    display: none !important;
  }
}

/* Inverte la firma solo visivamente quando il tema è scuro */
body:not(.light-theme) .sigBox canvas {
  filter: invert(1);
}

/* Pulsante "×" per cancellare la firma */
.sigBox {
  position: absolute; /* già presente, ma lo ripeto per sicurezza */
}

.sigClearBtn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
  font-size: 16px;
  font-weight: bold;
  line-height: 1;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: all 0.2s;
  touch-action: manipulation;
}

.sigClearBtn:hover {
  background: #ef4444;
  color: #ffffff;
  transform: scale(1.1);
}

.sigClearBtn:active {
  transform: scale(0.9);
}

/* Stile nel tema chiaro */
body.light-theme .sigClearBtn {
  background: rgba(153, 27, 27, 0.1);
  color: #991b1b;
}

body.light-theme .sigClearBtn:hover {
  background: #991b1b;
  color: #ffffff;
}

</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Caricamento modulo...</p>
</div>

<header class="hidden" id="appHeader">
  <h1>
  <img src="logo-s.png" alt="Cambia Tema" class="header-logo" id="themeToggle" style="cursor: pointer;" title="Cambia tema chiaro/scuro" onclick="toggleTema()">
  Dichiarazione Integrità Locale
</h1>
  <button class="danger" id="clearBtn">🗑️ Svuota campi</button>
  <button class="success" id="downloadBtn">💾 Salva PDF</button>
  <button id="printBtn">🖨️ Stampa</button>
</header>

<div id="toolbar" class="hidden">
  <span class="info">✍️ ATTENZIONE: quando firmi non appoggiare il palmo della mano, nello schermo.</span>
</div>

<div id="main" class="hidden">
  <div id="pdfContainer" class="dark-pdf">
    <canvas id="pdfCanvas"></canvas>
    <div id="overlay"></div>
  </div>
</div>

<!-- Modale per l'input di testo -->
<div id="inputModal" class="hidden">
    <div class="modal-content">
        <h3 id="modalLabel">Inserisci testo</h3>
        <textarea id="modalTextarea" placeholder="Scrivi qui..."></textarea>
        <div class="modal-buttons">
            <button class="secondary" id="modalCancel">Annulla</button>
            <button id="modalConfirm">Conferma</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* =========================================================

/* =========================================================
   SALVATAGGIO AUTOMATICO (localStorage)
   ========================================================= */
const STORAGE_KEY = 'moduloCED_dati';

/**
 * Salva i dati correnti di tutti i campi (testo + firma) in localStorage.
 */
function salvaDati() {
    try {
        const dati = elements.map(el => ({
            id: el.id,
            text: el.text || '',
            dataURL: el.dataURL || null
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dati));
    } catch (err) {
        console.warn('Impossibile salvare i dati:', err);
    }
}

/**
 * Carica i dati salvati e li applica ai campi esistenti.
 * Va chiamata DOPO che elements è stato inizializzato.
 */
function caricaDati() {
    try {
        const salvato = localStorage.getItem(STORAGE_KEY);
        if (!salvato) return;

        const dati = JSON.parse(salvato);
        elements.forEach(el => {
            const salvatoEl = dati.find(d => d.id === el.id);
            if (salvatoEl) {
                if (salvatoEl.text) el.text = salvatoEl.text;
                if (salvatoEl.dataURL) el.dataURL = salvatoEl.dataURL;
            }
        });
    } catch (err) {
        console.warn('Impossibile caricare i dati:', err);
    }
}

/**
 * Cancella i dati salvati (usato dal pulsante "Svuota campi").
 */
function cancellaDatiSalvati() {
    try {
        localStorage.removeItem(STORAGE_KEY);
    } catch (err) {
        console.warn('Impossibile cancellare i dati:', err);
    }
}

const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const container = document.getElementById('pdfContainer');

let pdfDoc = null;
let scale = 1;
let elements = [];

/* =========================================================
   GESTIONE TEMA CHIARO / SCURO
   ========================================================= */
const THEME_KEY = 'moduloCED_tema';

function applicaTema(tema) {
  const body = document.body;
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  const pdfContainer = document.getElementById('pdfContainer');
  
  if (tema === 'light') {
    body.classList.add('light-theme');
    if(metaTheme) metaTheme.setAttribute('content', '#991b1b');
    // ✅ Togliamo la classe dark-pdf nel tema chiaro!
    if (pdfContainer) pdfContainer.classList.remove('dark-pdf');
  } else {
    body.classList.remove('light-theme');
    if(metaTheme) metaTheme.setAttribute('content', '#1e293b');
    // ✅ Aggiungiamo la classe dark-pdf nel tema scuro
    if (pdfContainer) pdfContainer.classList.add('dark-pdf');
  }
}

// Applica il tema salvato appena la pagina è caricata
applicaTema(localStorage.getItem(THEME_KEY) || 'dark');

function toggleTema() {
  const isLight = document.body.classList.contains('light-theme');
  const nuovoTema = isLight ? 'dark' : 'light';
  
  // 1. Applichiamo il tema (aggiunge/toglie la classe)
  applicaTema(nuovoTema);
  localStorage.setItem(THEME_KEY, nuovoTema);
  
  if (typeof salvaDati === 'function') salvaDati();
  
  if (pdfDoc) {
    // ✅ ASPETTIAMO 150ms. Questo dà al browser il tempo di applicare 
    // il colore del tema prima di ridisegnare la firma.
    setTimeout(() => {
      renderPage();
    }, 150);
  }
}

let orientamentoCorrente = null;

function rilevaOrientamento() {
  const isPortrait = window.matchMedia('(orientation: portrait)').matches;
  const isSmallScreen = Math.min(window.innerWidth, window.innerHeight) < 500;
  const nuovoOrientamento = isPortrait ? 'portrait' : 'landscape';

  if (nuovoOrientamento !== orientamentoCorrente) {
    orientamentoCorrente = nuovoOrientamento;
    console.log('📱 Orientamento:', orientamentoCorrente);

    const hint = document.getElementById('rotateHint');
    if (hint) {
      if (isPortrait && isSmallScreen) {
        hint.classList.add('visible');
        setTimeout(() => hint.classList.remove('visible'), 5000);
      } else {
        hint.classList.remove('visible');
      }
    }

    if (pdfDoc) {
      setTimeout(() => {
        if (typeof salvaDati === 'function') salvaDati();
        renderPage();
      }, 150);
    }
  }
}

if (window.matchMedia) {
  window.matchMedia('(orientation: portrait)').addEventListener('change', rilevaOrientamento);
  window.matchMedia('(orientation: landscape)').addEventListener('change', rilevaOrientamento);
}

window.addEventListener('orientationchange', () => {
  setTimeout(rilevaOrientamento, 200);
});

setTimeout(rilevaOrientamento, 500);

/* =========================================================
   AVVIO: decodifica Base64 e carica PDF
   ========================================================= */
async function avvia() {
  try {
    const bin = atob(PDF_BASE64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;

    elements = CAMPI_INIZIALI.map(c => ({ ...c }));
    caricaDati(); 

    await renderPage();

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('appHeader').classList.remove('hidden');
    document.getElementById('toolbar').classList.remove('hidden');
    document.getElementById('main').classList.remove('hidden');
  } catch (err) {
    document.getElementById('loading').innerHTML =
      '<p style="color:red">Errore: ' + err.message + '</p>';
    console.error(err);
  }
}

/* =========================================================
   RENDER
   ========================================================= */
async function renderPage() {
  const page = await pdfDoc.getPage(1);
  const vp1 = page.getViewport({ scale: 1 });
  const maxWidth = Math.min(window.innerWidth - 40, 900);
  scale = maxWidth / vp1.width;
  const vp = page.getViewport({ scale });

  canvas.width = vp.width;
  canvas.height = vp.height;
  container.style.width = vp.width + 'px';
  container.style.height = vp.height + 'px';

  await page.render({ canvasContext: ctx, viewport: vp }).promise;

  overlay.innerHTML = '';
  const isLight = document.body.classList.contains('light-theme');
  elements.forEach(el => drawElement(el, isLight));
}

/* =========================================================
   DISEGNO ELEMENTI
   ========================================================= */
function drawElement(el, isLight) {
  const px = el.x * canvas.width;
  const py = el.y * canvas.height;
  const pw = el.w * canvas.width;
  const ph = el.h * canvas.height;

  let node;

  if (el.type === 'text') {
    node = document.createElement('textarea');
    node.className = 'field';
    node.placeholder = el.label || '';
    node.value = el.text || '';
    node.setAttribute('data-id', el.id);
    node.style.left = px + 'px';
    node.style.top = py + 'px';
    node.style.width = pw + 'px';
    node.style.height = ph + 'px';

    // Non aggiornare direttamente il valore, ma apri la modale
    node.addEventListener('input', () => { el.text = node.value; });

    // Quando l'utente tocca la casella, apri la modale
    node.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const modal = document.getElementById('inputModal');
        const modalTextarea = document.getElementById('modalTextarea');
        const modalLabel = document.getElementById('modalLabel');

        // Aggiorna l'etichetta con il nome del campo
        modalLabel.textContent = el.label || 'Inserisci testo';

// ✅ Se è un campo data e non c'è già un valore, proponi la data odierna
if (el.isDate && (!el.text || el.text.trim() === '')) {
    modalTextarea.value = dataOdierna();
} else {
    modalTextarea.value = el.text || '';
}

currentEditingElement = el;

        // ✅ Se è un campo data, cambia il placeholder e attiva la tastiera numerica
    if (el.isDate) {
        modalTextarea.placeholder = 'GG/MM/AAAA';
        modalTextarea.setAttribute('inputmode', 'numeric');
        modalTextarea.setAttribute('maxlength', '10'); // 10 = GG/MM/AAAA
    } else {
        modalTextarea.placeholder = 'Scrivi qui...';
        modalTextarea.removeAttribute('inputmode');
        modalTextarea.removeAttribute('maxlength');
    }

    modal.classList.remove('hidden');

    setTimeout(() => {
        modalTextarea.focus();
        // Posiziona il cursore alla fine del testo
        modalTextarea.setSelectionRange(modalTextarea.value.length, modalTextarea.value.length);
    }, 100);
});

}
    else if (el.type === 'signature') {
    node = document.createElement('div');
    node.className = 'sigBox';
    node.style.left = px + 'px';
    node.style.top = py + 'px';
    node.style.width = pw + 'px';
    node.style.height = ph + 'px';

    const lab = document.createElement('div');
    lab.className = 'sigLabel';
    lab.textContent = '✍️ Firma qui';
    node.appendChild(lab);

        // ✅ Pulsante "×" per cancellare la firma
    const clearBtn = document.createElement('button');
    clearBtn.className = 'sigClearBtn';
    clearBtn.type = 'button';
    clearBtn.textContent = '×';
    clearBtn.title = 'Cancella firma';
    node.appendChild(clearBtn);

    const c = document.createElement('canvas');
    const dpr = 2;
    c.width = pw * dpr;
    c.height = ph * dpr;
    node.appendChild(c);

    const cctx = c.getContext('2d');
    cctx.scale(dpr, dpr);
    cctx.lineWidth = 2.5;
    cctx.lineCap = 'round';
    cctx.lineJoin = 'round';

     // Disegniamo SEMPRE in nero sul canvas. L'aspetto bianco nel tema scuro
    // si ottiene solo visivamente al momento del render.
    cctx.strokeStyle = '#000000';

    let drawing = false;
    const pos = e => {
      const r = c.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    const start = e => {
      e.preventDefault();
      e.stopPropagation();
      drawing = true;
      const p = pos(e);
      cctx.beginPath();
      cctx.moveTo(p.x, p.y);
    };
    const move = e => {
      if (!drawing) return;
      e.preventDefault();
      e.stopPropagation();
      const p = pos(e);
      cctx.lineTo(p.x, p.y);
      cctx.stroke();
    };
    const end = () => {
      if (!drawing) return;
      drawing = false;
      // ✅ Salviamo il tratto nero puro
      el.dataURL = c.toDataURL('image/png');
      salvaDati();
    };

    c.addEventListener('mousedown', start);
    c.addEventListener('mousemove', move);
    c.addEventListener('mouseup', end);
    c.addEventListener('mouseleave', end);
    c.addEventListener('touchstart', start, { passive: false });
    c.addEventListener('touchmove', move, { passive: false });
    c.addEventListener('touchend', end);

        // ✅ Listener per cancellare la firma
    clearBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      
      const conferma = confirm('⚠️ Vuoi davvero cancellare la firma?\n\nDovrai firmare di nuovo.');
      if (!conferma) return;
      
      // Pulisci il canvas visibile
      cctx.clearRect(0, 0, pw, ph);
      
      // Rimuovi la firma dai dati
      el.dataURL = null;
      salvaDati();
    });

    if (el.dataURL) {
      const img = new Image();
      img.onload = () => {
        cctx.clearRect(0, 0, pw, ph);
        cctx.drawImage(img, 0, 0, pw, ph);
      };
      img.src = el.dataURL;
    }
  }

  overlay.appendChild(node);
}

/* =========================================================
   TRASCINAMENTO
   ========================================================= */
function makeDraggable(handle, node, el) {
  let dragging = false, sx, sy, ox, oy;

  const getXY = e => {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  };

  const start = e => {
    e.preventDefault(); e.stopPropagation();
    dragging = true;
    const p = getXY(e);
    sx = p.x; sy = p.y;
    ox = el.x; oy = el.y;
  };
  const move = e => {
    if (!dragging) return;
    e.preventDefault();
    const p = getXY(e);
    const dx = (p.x - sx) / canvas.width;
    const dy = (p.y - sy) / canvas.height;
    el.x = Math.max(0, Math.min(1 - el.w, ox + dx));
    el.y = Math.max(0, Math.min(1 - el.h, oy + dy));
    node.style.left = (el.x * canvas.width) + 'px';
    node.style.top  = (el.y * canvas.height) + 'px';
  };
  const end = () => { if (dragging) { dragging = false; savePositions(); } };

  handle.addEventListener('mousedown', start);
  handle.addEventListener('touchstart', start, { passive: false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
}

async function exportPdf(printMode) {
  const btn = printMode ? document.getElementById('printBtn') : document.getElementById('downloadBtn');
  const oldTxt = btn.textContent;
  btn.textContent = '⏳...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const page = await pdfDoc.getPage(1);
    const vp1 = page.getViewport({ scale: 1 });
    const pdfW = vp1.width;
    const pdfH = vp1.height;

    const out = new jsPDF({ unit: 'pt', format: [pdfW, pdfH], orientation: pdfW > pdfH ? 'l' : 'p' });

    const vp = page.getViewport({ scale: 2 });
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = vp.width;
    tmpCanvas.height = vp.height;
    await page.render({ canvasContext: tmpCanvas.getContext('2d'), viewport: vp }).promise;
    out.addImage(tmpCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pdfW, pdfH);

    for (const el of elements) {
      const x = el.x * pdfW;
      const y = el.y * pdfH;
      const w = el.w * pdfW;
      const h = el.h * pdfH;

      if (el.type === 'text' && el.text && el.text.trim()) {
        out.setFontSize(11);
        out.setTextColor(0, 0, 0);
        el.text.split('\n').forEach((line, i) => out.text(line, x + 2, y + 13 + i * 13));
      }
      else if (el.type === 'signature' && el.dataURL) {
        out.addImage(el.dataURL, 'PNG', x, y, w, h);
      }
    }

    if (printMode) {
      out.autoPrint();
      window.open(out.output('bloburl'), '_blank');
    } else {
      // ✅ Genera il nome del file: CED_[Azienda]_[Data].pdf
      const campoAzienda = elements.find(e => e.id === 'azienda');
      const nomeAzienda = (campoAzienda && campoAzienda.text ? campoAzienda.text.trim() : 'SenzaAzienda')
        .replace(/[\\/:*?"<>|]/g, '_'); // Sostituisce solo i caratteri non validi per i file

      // Data di oggi in formato GG-MM-AAAA
      const oggi = new Date();
      const giorno = String(oggi.getDate()).padStart(2, '0');
      const mese = String(oggi.getMonth() + 1).padStart(2, '0');
      const anno = oggi.getFullYear();
      
      const dataString = giorno + '-' + mese + '-' + anno;

      const nomeFile = 'CED_' + nomeAzienda + '_' + dataString + '.pdf';

      out.save(nomeFile)
      ;
    }
  } catch (err) {
    alert('Errore: ' + err.message);
    console.error(err);
  } finally {
    btn.textContent = oldTxt;
    btn.disabled = false;
  }
}

/* =========================================================
   FORMATTAZIONE DATA GG/MM/AAAA
   ========================================================= */
/**
 * Prende una stringa di cifre e la formatta come GG/MM/AAAA.
 * Esempi:
 *   "" → ""
 *   "1" → "1"
 *   "12" → "12"
 *   "123" → "12/3"
 *   "1234" → "12/34"
 *   "12345" → "12/34/5"
 *   "12345678" → "12/34/5678"
 */
function formattaData(valore) {
    // Tieni solo le cifre
    const cifre = valore.replace(/\D/g, '').slice(0, 8);

    if (cifre.length === 0) return '';
    if (cifre.length <= 2) return cifre;                              // GG
    if (cifre.length <= 4) return cifre.slice(0, 2) + '/' + cifre.slice(2); // GG/MM
    return cifre.slice(0, 2) + '/' + cifre.slice(2, 4) + '/' + cifre.slice(4); // GG/MM/AAAA
}

/**
 * Ritorna la data odierna nel formato GG/MM/AAAA.
 */
function dataOdierna() {
    const oggi = new Date();
    const gg = String(oggi.getDate()).padStart(2, '0');
    const mm = String(oggi.getMonth() + 1).padStart(2, '0');
    const aaaa = oggi.getFullYear();
    return `${gg}/${mm}/${aaaa}`;
}

/**
 * Valida una data nel formato GG/MM/AAAA.
 * Ritorna true se la data è valida e completa.
 */
function validaData(str) {
    const match = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!match) return false;

    const giorno = parseInt(match[1], 10);
    const mese   = parseInt(match[2], 10);
    const anno   = parseInt(match[3], 10);

    if (mese < 1 || mese > 12) return false;
    if (giorno < 1 || giorno > 31) return false;
    if (anno < 1900 || anno > 2100) return false;

    // Verifica giorni per mese
    const giorniPerMese = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    // Anno bisestile
    const bisestile = (anno % 4 === 0 && anno % 100 !== 0) || (anno % 400 === 0);
    if (bisestile) giorniPerMese[1] = 29;

    return giorno <= giorniPerMese[mese - 1];
}

    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('modalConfirm').click();
    } else if (e.key === 'Escape') {
        e.preventDefault();
        document.getElementById('modalCancel').click();
    }
});

// ✅ Formattazione automatica per i campi data
document.getElementById('modalTextarea').addEventListener('input', (e) => {
    if (currentEditingElement && currentEditingElement.isDate) {
        const posizioneVecchia = e.target.selectionStart;
        const valoreVecchio = e.target.value;
        const nuovoValore = formattaData(valoreVecchio);

        if (nuovoValore !== valoreVecchio) {
            e.target.value = nuovoValore;

            const differenza = nuovoValore.length - valoreVecchio.length;
            const nuovaPosizione = posizioneVecchia + differenza;
            e.target.setSelectionRange(nuovaPosizione, nuovaPosizione);
        }
    }
});
